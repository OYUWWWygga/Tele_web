<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tele Web</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#0b1220; --surface:rgba(17,24,39,.92); --border:rgba(255,255,255,.10); --text:#f8fafc; --muted:#94a3b8; --shadow:0 18px 40px rgba(0,0,0,.28); --radius:18px; --radius-sm:14px; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; overflow:hidden; }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(circle at top,#172554 0%,var(--bg) 45%,#020617 100%); color:var(--text); }
    .app-shell { height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column; }
    .app-content { flex:1 1 auto; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:16px 16px calc(96px + env(safe-area-inset-bottom)); max-width:1120px; margin:0 auto; width:100%; }
    .topbar, .hero, .toolbar, .card, .player-panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(10px); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; position:sticky; top:12px; z-index:20; }
    .brand { display:flex; flex-direction:column; gap:2px; }
    .brand h1 { font-size:18px; margin:0; line-height:1.1; }
    .brand small { color:var(--muted); }
    .chip { display:inline-flex; align-items:center; padding:8px 12px; border-radius:999px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--muted); font-size:13px; }
    .hero { margin-top:16px; padding:18px; }
    .hero h2 { margin:0 0 8px; font-size:24px; }
    .hero p { margin:0; color:var(--muted); line-height:1.6; }
    .toolbar { margin-top:16px; padding:14px; display:grid; gap:10px; }
    .searchbar { display:flex; gap:10px; flex-wrap:wrap; }
    .searchbar input, .searchbar select { flex:1 1 200px; border-radius:var(--radius-sm); border:1px solid var(--border); background:rgba(255,255,255,.05); color:var(--text); padding:12px 14px; font:inherit; outline:none; min-height:48px; }
    .searchbar input::placeholder { color:#94a3b8; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; }
    .filters button, .action, .play-btn, .less-btn, .back-btn { border:0; border-radius:var(--radius-sm); padding:12px 14px; font:inherit; font-weight:700; cursor:pointer; min-height:46px; }
    .filters button, .less-btn, .back-btn { color:#08111f; background:linear-gradient(180deg,#e5e7eb,#cbd5e1); }
    .filters button.active { background:linear-gradient(180deg,#86efac,#22c55e); color:#052e16; }
    .play-btn { color:#052e16; background:linear-gradient(180deg,#86efac,#22c55e); width:100%; }
    .grid { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
    .card { overflow:hidden; cursor:pointer; transition:transform .18s ease, border-color .18s ease; }
    .card.expanded { border-color:rgba(134,239,172,.55); transform:scale(1.01); }
    .poster, .poster-fallback { width:100%; aspect-ratio:2/3; display:block; object-fit:cover; background:linear-gradient(180deg,rgba(56,189,248,.22),rgba(34,197,94,.18)); }
    .poster-fallback { display:grid; place-items:center; color:white; font-weight:800; text-align:center; padding:12px; }
    .card-body { padding:10px 10px 12px; }
    .title { margin:0 0 4px; font-size:14px; line-height:1.25; }
    .meta { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .badge { display:inline-flex; align-items:center; justify-content:center; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; color:#052e16; background:#86efac; }
    .extra { display:none; padding:0 10px 12px; color:var(--muted); line-height:1.55; font-size:13px; }
    .card.expanded .extra { display:block; }
    .card.expanded .poster, .card.expanded .poster-fallback { aspect-ratio:16/9; }
    .card-actions { display:none; gap:8px; flex-wrap:wrap; padding:0 10px 12px; }
    .card.expanded .card-actions { display:block; }
    .card-actions .play-btn, .card-actions .less-btn { width:100%; }
    .card-actions .less-btn { margin-top:8px; }
    .status { margin-top:14px; color:var(--muted); font-size:14px; text-align:center; }
    .footerbar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,rgba(2,6,23,.86) 20%,rgba(2,6,23,.98)); }
    .footerbar .inner { max-width:1120px; margin:0 auto; display:flex; gap:10px; }
    .footerbar .inner button { flex:1; min-height:48px; }
    .player-panel { display:none; margin-top:16px; overflow:hidden; }
    .player-panel.active { display:block; }
    .player-top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); }
    .player-title { display:flex; flex-direction:column; gap:2px; }
    .player-title strong { font-size:15px; }
    .player-title small { color:var(--muted); }
    .iframe-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; }
    iframe { width:100%; height:100%; border:0; display:block; }
    @media (max-width:640px) { .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); } .iframe-wrap { aspect-ratio: 9/16; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-content" id="appContent">
      <header class="topbar">
        <div class="brand"><h1>Tele Web</h1><small id="userLabel">Catálogo visual</small></div>
        <div class="chip" id="modeChip">Mini App</div>
      </header>

      <section class="hero">
        <h2>Catálogo en pósters</h2>
        <p>Los datos se cargan desde <code>catalog.json</code>. Puedes pegar cualquier URL de video y el sistema intenta convertirla al formato correcto.</p>
      </section>

      <section class="toolbar">
        <div class="searchbar">
          <input id="searchInput" type="text" placeholder="Buscar por título, género o año..." />
          <select id="typeSelect">
            <option value="">Todo</option>
            <option value="Terror">Terror</option>
            <option value="Ciencia ficción">Ciencia ficción</option>
            <option value="Aventura">Aventura</option>
            <option value="Animación">Animación</option>
          </select>
        </div>
        <div class="filters">
          <button class="active" data-filter="all">Todo</button>
          <button data-filter="featured">Destacados</button>
          <button data-filter="latest">Recientes</button>
        </div>
      </section>

      <section id="playerPanel" class="player-panel">
        <div class="player-top">
          <div class="player-title">
            <strong id="playerMovieTitle">Reproductor</strong>
            <small id="playerMovieMeta">Cargando...</small>
          </div>
          <button class="back-btn" id="closePlayerBtn">Cerrar</button>
        </div>
        <div class="iframe-wrap">
          <iframe id="playerFrame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </section>

      <main id="catalogSection">
        <div id="grid" class="grid"></div>
        <div id="status" class="status">Cargando catálogo...</div>
      </main>
    </div>
  </div>

  <div class="footerbar">
    <div class="inner">
      <button class="action" id="loadMoreBtn">Cargar más</button>
      <button class="action" id="closeAllBtn">Cerrar todo</button>
    </div>
  </div>

  <script>
    const CATALOG_URL = 'catalog.json';
    const PLAYER_URL = 'https://oyuwwwygga.github.io/Tele_web/player.html';
    const tg = window.Telegram?.WebApp || null;
    const appContent = document.getElementById('appContent');
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const searchInput = document.getElementById('searchInput');
    const typeSelect = document.getElementById('typeSelect');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const closeAllBtn = document.getElementById('closeAllBtn');
    const filterButtons = [...document.querySelectorAll('.filters button')];
    const playerPanel = document.getElementById('playerPanel');
    const catalogSection = document.getElementById('catalogSection');
    const playerFrame = document.getElementById('playerFrame');
    const playerMovieTitle = document.getElementById('playerMovieTitle');
    const playerMovieMeta = document.getElementById('playerMovieMeta');
    const closePlayerBtn = document.getElementById('closePlayerBtn');

    let allItems = [];
    let filteredItems = [];
    let visibleCount = 12;
    let activeFilter = 'all';

    function esc(str) { return String(str ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
    function cardHtml(item, i) {
      return `
        <article class="card" data-index="${i}">
          ${item.poster_url ? `<img class="poster" src="${esc(item.poster_url)}" alt="${esc(item.title)}" loading="lazy">` : `<div class="poster-fallback">${esc(item.title)}</div>`}
          <div class="card-body">
            <h3 class="title">${esc(item.title)}</h3>
            <div class="meta"><span>${esc(item.year ?? '')}</span>${item.is_featured ? '<span class="badge">Destacado</span>' : '<span>' + esc(item.type || '') + '</span>'}</div>
          </div>
          <div class="extra">
            <p><strong>Género:</strong> ${esc(item.type ?? '')}</p>
            <p><strong>Año:</strong> ${esc(item.year ?? '')}</p>
            <p>${esc(item.description || 'Sin descripción')}</p>
          </div>
          <div class="card-actions">
            <button class="play-btn" data-action="play">Ver peli</button>
            <button class="less-btn" data-action="less">Ver menos</button>
          </div>
        </article>`;
    }

    function renderGrid() {
      const items = filteredItems.slice(0, visibleCount);
      grid.innerHTML = items.map((item, i) => cardHtml(item, i)).join('');
      grid.querySelectorAll('.card').forEach(card => {
        const idx = Number(card.dataset.index);
        const item = filteredItems[idx];
        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-action]')) return;
          toggleCard(card);
        });
        card.querySelector('[data-action="play"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          openPlayer(item);
        });
        card.querySelector('[data-action="less"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          card.classList.remove('expanded');
        });
      });
      status.textContent = filteredItems.length ? `Mostrando ${items.length} de ${filteredItems.length} títulos` : 'No hay resultados';
      loadMoreBtn.style.display = visibleCount < filteredItems.length ? 'block' : 'none';
    }

    function toggleCard(cardEl) {
      const expanding = !cardEl.classList.contains('expanded');
      document.querySelectorAll('.card.expanded').forEach(c => { if (c !== cardEl) c.classList.remove('expanded'); });
      cardEl.classList.toggle('expanded', expanding);
      if (expanding) scrollIntoViewIfNeeded(cardEl);
    }

    function scrollIntoViewIfNeeded(cardEl) {
      if (!cardEl || !appContent) return;
      const rect = cardEl.getBoundingClientRect();
      const target = appContent.scrollTop + rect.top - (appContent.clientHeight * 0.22);
      if (rect.top < 40 || rect.bottom > window.innerHeight - 40) {
        appContent.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    }

    function detectVideo(url) {
      if (!url) return null;
      const s = String(url).trim();
      try {
        const u = new URL(s);
        const host = u.hostname.replace(/^www\./, '').toLowerCase();
        if (host.includes('youtube.com') || host === 'youtu.be') return { provider: 'youtube', url: s };
        if (host.includes('dailymotion.com') || host === 'dai.ly') return { provider: 'dailymotion', url: s };
        if (host.includes('vimeo.com')) return { provider: 'vimeo', url: s };
        if (host.includes('facebook.com') || host.includes('fb.watch')) return { provider: 'facebook', url: s };
        if (host.includes('tiktok.com')) return { provider: 'tiktok', url: s };
        return { provider: 'generic', url: s };
      } catch {
        return { provider: 'generic', url: s };
      }
    }

    function youtubeToEmbed(url) {
      const s = String(url).trim();
      if (s.includes('/embed/')) return s;
      const m1 = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
      if (m1) return `https://www.youtube.com/embed/${m1[1]}`;
      const m2 = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
      if (m2) return `https://www.youtube.com/embed/${m2[1]}`;
      const m3 = s.match(/shorts\/([A-Za-z0-9_-]{6,})/);
      if (m3) return `https://www.youtube.com/embed/${m3[1]}`;
      return s;
    }

    function dailymotionToEmbed(url) {
      const s = String(url).trim();
      const id = s.match(/(?:video\/|dai\.ly\/)([A-Za-z0-9]+)/)?.[1];
      if (id) return `https://geo.dailymotion.com/player.html?video=${id}`;
      const id2 = s.match(/video\/([A-Za-z0-9]+)/)?.[1];
      if (id2) return `https://geo.dailymotion.com/player.html?video=${id2}`;
      return s;
    }

    function vimeoToEmbed(url) {
      const s = String(url).trim();
      const id = s.match(/vimeo\.com\/(?:video\/)?(\d+)/)?.[1];
      if (id) return `https://player.vimeo.com/video/${id}`;
      return s;
    }

    function genericEmbed(url) {
      return String(url || '').trim();
    }

    function buildPlayableUrl(url) {
      const video = detectVideo(url);
      if (!video) return null;
      if (video.provider === 'youtube') return youtubeToEmbed(video.url);
      if (video.provider === 'dailymotion') return dailymotionToEmbed(video.url);
      if (video.provider === 'vimeo') return vimeoToEmbed(video.url);
      return genericEmbed(video.url);
    }

    function openPlayer(item) {
      const rawUrl = item?.video_url || '';
      const playableUrl = buildPlayableUrl(rawUrl);
      if (!playableUrl) {
        alert(`La película "${item?.title || 'sin título'}" no tiene video configurado todavía.`);
        return;
      }
      playerMovieTitle.textContent = item?.title || 'Reproductor';
      playerMovieMeta.textContent = item?.type ? `${item.type} · ${item.year || ''}` : 'Video';
      playerFrame.src = playableUrl;
      playerPanel.classList.add('active');
      catalogSection.style.display = 'none';
      appContent.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      playerFrame.src = 'about:blank';
      playerPanel.classList.remove('active');
      catalogSection.style.display = 'block';
    }

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const type = typeSelect.value.trim().toLowerCase();
      let items = [...allItems];
      if (activeFilter === 'featured') items = items.filter(i => i.is_featured);
      if (activeFilter === 'latest') items = [...items].sort((a, b) => (b.year || 0) - (a.year || 0));
      if (q) items = items.filter(item => [item.title, item.type, item.year].some(v => String(v ?? '').toLowerCase().includes(q)));
      if (type) items = items.filter(item => String(item.type ?? '').toLowerCase() === type);
      filteredItems = items;
      visibleCount = 12;
      renderGrid();
    }

    async function loadCatalog() {
      try {
        const res = await fetch(CATALOG_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allItems = await res.json();
        if (!Array.isArray(allItems)) throw new Error('catalog.json debe ser una lista');
      } catch (err) {
        console.error('[index] error cargando catalog.json', err);
        allItems = [];
      }
      filteredItems = [...allItems];
      renderGrid();
    }

    filterButtons.forEach(btn => btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      applyFilters();
    }));

    searchInput.addEventListener('input', applyFilters);
    typeSelect.addEventListener('change', applyFilters);
    loadMoreBtn.addEventListener('click', () => { visibleCount += 12; renderGrid(); });
    closeAllBtn.addEventListener('click', () => document.querySelectorAll('.card.expanded').forEach(c => c.classList.remove('expanded')));
    closePlayerBtn.addEventListener('click', closePlayer);

    if (tg) {
      tg.ready();
      if (typeof tg.expand === 'function') tg.expand();
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
      document.getElementById('userLabel').textContent = 'Dentro de Telegram';
      document.getElementById('modeChip').textContent = 'Telegram WebApp';
    }

    loadCatalog();
  </script>
</body>
</html>
