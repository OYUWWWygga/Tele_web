<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reproductor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex: 0 0 auto;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .title strong {
      font-size: 15px;
      line-height: 1.2;
    }
    .title small {
      color: #94a3b8;
      font-size: 12px;
    }
    .back {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: #e5e7eb;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }
    .player-wrap {
      position: relative;
      flex: 1 1 auto;
      background: #000;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      right: 12px;
      color: #cbd5e1;
      font-size: 12px;
      text-align: center;
      background: rgba(15,23,42,.70);
      padding: 8px 10px;
      border-radius: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">
        <strong id="movieTitle">Reproductor</strong>
        <small id="movieMeta">Video embebido</small>
      </div>
      <button class="back" onclick="goBack()">Volver</button>
    </div>
    <div class="player-wrap">
      <iframe id="playerFrame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      <div class="hint">Si el video no carga, revisa el ID o la configuración de inserción de YouTube.</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp || null;
    const params = new URLSearchParams(location.search);
    const video = params.get('video') || '';
    const title = params.get('title') || 'Reproductor';

    document.getElementById('movieTitle').textContent = title;
    document.getElementById('movieMeta').textContent = video ? `ID: ${video}` : 'Sin video asignado';

    if (video) {
      document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${encodeURIComponent(video)}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
    }

    function goBack() {
      if (tg && typeof tg.close === 'function') tg.close();
      else history.back();
    }

    if (tg) {
      tg.ready();
      if (typeof tg.expand === 'function') tg.expand();
    }
  </script>
</body>
</html>
