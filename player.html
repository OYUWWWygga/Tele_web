<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>TO2PELISFOCUS</title><link rel="stylesheet" href="css/styles.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><div class="app-shell"><div class="app-content"><header class="topbar"><div class="brand"><h1>TO2PELISFOCUS</h1><small id="userLabel">Catálogo visual</small></div><span class="chip" id="modeChip">Mini App</span></header><section class="hero"><h2>Catálogo en pósters</h2><p>Busca, filtra, guarda favoritos y abre únicamente enlaces autorizados o de contenido permitido.</p></section><section class="toolbar"><div class="searchbar"><input id="searchInput" type="search" placeholder="Buscar por título, género, año..." aria-label="Buscar"><select id="typeSelect" aria-label="Filtrar por género"><option>Todo</option><option>Terror</option><option>Ciencia ficción</option><option>Aventura</option><option>Animación</option></select><select id="sortSelect" aria-label="Ordenar"><option value="default">Ordenar</option><option value="recent">Más recientes</option><option value="alpha">Alfabético</option></select></div><div class="filters"><button class="active" data-filter="all">Todo</button><button data-filter="featured">Destacados</button><button data-filter="favorites" id="favoritesBtn">Favoritos</button></div></section><section id="playerPanel" class="player-panel"><div class="player-top"><div class="player-title"><strong id="playerMovieTitle">Reproductor</strong><small id="playerMovieMeta">Cargando...</small></div><button class="back-btn" id="closePlayerBtn">Cerrar</button></div><div class="iframe-wrap"><iframe id="playerFrame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></section><main id="catalogSection"><div id="grid" class="grid" aria-live="polite"></div><div id="status" class="status">Cargando catálogo...</div><div id="errorBox" class="error-box" hidden><p>No se pudo cargar el catálogo.</p><button id="retryBtn" class="back-btn">Reintentar</button></div></main></div><footer class="footerbar"><div class="inner"><button class="action" id="loadMoreBtn">Ver más</button><button class="action" id="closeAllBtn">Cerrar todo</button></div></footer></div><script src="js/app.js"></script></body></html>
