<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tele Web</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --surface: rgba(17, 24, 39, 0.92);
      --surface-2: rgba(15, 23, 42, 0.98);
      --border: rgba(255,255,255,0.10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --danger: #fb7185;
      --shadow: 0 18px 40px rgba(0,0,0,.28);
      --radius: 18px;
      --radius-sm: 14px;
      --gap: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg) 45%, #020617 100%);
      color: var(--text);
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 12px;
      z-index: 20; backdrop-filter: blur(10px);
    }

    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { font-size: 18px; margin: 0; line-height: 1.1; }
    .brand small { color: var(--muted); }

    .chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--muted);
      font-size: 13px; white-space: nowrap;
    }

    .hero {
      margin-top: 16px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      margin-top: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .searchbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .searchbar input,
    .searchbar select {
      flex: 1 1 200px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
      min-height: 48px;
    }

    .searchbar input::placeholder { color: #94a3b8; }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters button,
    .mini-btn,
    .action {
      border: 0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      color: #08111f;
      background: linear-gradient(180deg, #e5e7eb, #cbd5e1);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      min-height: 46px;
    }

    .filters button.active {
      background: linear-gradient(180deg, #86efac, #22c55e);
      color: #052e16;
    }

    .filters button:active,
    .mini-btn:active,
    .action:active { transform: translateY(1px); }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.18); }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(34,197,94,.18));
      display: block;
      object-fit: cover;
    }

    .poster-fallback {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(34,197,94,.18));
      color: white;
      font-weight: 800;
      letter-spacing: .5px;
      text-align: center;
      padding: 12px;
      line-height: 1.2;
    }

    .card-body {
      padding: 10px 10px 12px;
    }

    .title {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.25;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #052e16;
      background: #86efac;
      white-space: nowrap;
    }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .footerbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px 16px;
      background: linear-gradient(180deg, transparent, rgba(2,6,23,.86) 20%, rgba(2,6,23,.98));
      backdrop-filter: blur(10px);
    }

    .footerbar .inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .footerbar .inner button {
      flex: 1;
      min-height: 48px;
    }

    .detail {
      margin-top: 16px;
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .detail.active { display: block; }

    .detail-inner {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      padding: 16px;
    }

    .detail-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: rgba(255,255,255,0.05);
    }

    .detail-info h3 { margin: 0 0 6px; font-size: 20px; }
    .detail-info p { margin: 0 0 10px; color: var(--muted); line-height: 1.6; }
    .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 640px) {
      .detail-inner { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Tele Web</h1>
        <small id="userLabel">Catálogo visual</small>
      </div>
      <div class="chip" id="modeChip">Mini App</div>
    </header>

    <section class="hero">
      <h2>Catálogo en pósters</h2>
      <p>Explora tus películas y series en formato grid, ideal para catálogos grandes. Toca una tarjeta para ver su detalle.</p>
    </section>

    <section class="toolbar">
      <div class="searchbar">
        <input id="searchInput" type="text" placeholder="Buscar por título, género o año..." />
        <select id="typeSelect">
          <option value="">Todo</option>
          <option value="Terror">Terror</option>
          <option value="Ciencia ficción">Ciencia ficción</option>
          <option value="Aventura">Aventura</option>
          <option value="Animación">Animación</option>
        </select>
      </div>
      <div class="filters">
        <button class="active" data-filter="all">Todo</button>
        <button data-filter="featured">Destacados</button>
        <button data-filter="latest">Recientes</button>
      </div>
    </section>

    <section id="detailView" class="detail"></section>

    <main>
      <div id="grid" class="grid"></div>
      <div id="status" class="status">Cargando catálogo...</div>
    </main>
  </div>

  <div class="footerbar">
    <div class="inner">
      <button class="action" id="loadMoreBtn">Cargar más</button>
      <button class="action" id="closeDetailBtn">Cerrar detalle</button>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8000/api';
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const searchInput = document.getElementById('searchInput');
    const typeSelect = document.getElementById('typeSelect');
    const detailView = document.getElementById('detailView');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    const filterButtons = [...document.querySelectorAll('.filters button')];

    let allItems = [];
    let filteredItems = [];
    let visibleCount = 12;
    let activeFilter = 'all';

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
    }

    function posterMarkup(item) {
      if (item.poster_url) {
        return `<img class="poster" src="${escapeHtml(item.poster_url)}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.outerHTML='<div class=poster-fallback>${escapeHtml(item.title)}</div>'">`;
      }
      return `<div class="poster-fallback">${escapeHtml(item.title)}</div>`;
    }

    function renderGrid() {
      const items = filteredItems.slice(0, visibleCount);
      grid.innerHTML = items.map(item => `
        <article class="card" data-slug="${escapeHtml(item.slug || item.title)}">
          ${posterMarkup(item)}
          <div class="card-body">
            <h3 class="title">${escapeHtml(item.title)}</h3>
            <div class="meta">
              <span>${escapeHtml(item.year ?? '')}</span>
              ${item.is_featured ? '<span class="badge">Destacado</span>' : '<span>' + escapeHtml(item.type || '') + '</span>'}
            </div>
          </div>
        </article>
      `).join('');

      [...grid.querySelectorAll('.card')].forEach((card, idx) => {
        card.addEventListener('click', () => openDetail(filteredItems[idx]));
      });

      status.textContent = filteredItems.length
        ? `Mostrando ${items.length} de ${filteredItems.length} títulos`
        : 'No hay resultados';

      loadMoreBtn.style.display = visibleCount < filteredItems.length ? 'block' : 'none';
    }

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const type = typeSelect.value.trim().toLowerCase();
      let items = [...allItems];

      if (activeFilter === 'featured') items = items.filter(i => i.is_featured);
      if (activeFilter === 'latest') items = [...items].sort((a, b) => (b.year || 0) - (a.year || 0));

      if (q) {
        items = items.filter(item =>
          String(item.title ?? '').toLowerCase().includes(q) ||
          String(item.type ?? '').toLowerCase().includes(q) ||
          String(item.year ?? '').includes(q)
        );
      }

      if (type) {
        items = items.filter(item => String(item.type ?? '').toLowerCase() === type);
      }

      filteredItems = items;
      visibleCount = 12;
      renderGrid();
    }

    function openDetail(item) {
      if (!item) return;
      detailView.classList.add('active');
      detailView.innerHTML = `
        <div class="detail-inner">
          ${item.poster_url ? `<img class="detail-poster" src="${escapeHtml(item.poster_url)}" alt="${escapeHtml(item.title)}" loading="lazy">` : `<div class="detail-poster poster-fallback">${escapeHtml(item.title)}</div>`}
          <div class="detail-info">
            <h3>${escapeHtml(item.title)}</h3>
            <p><strong>Año:</strong> ${escapeHtml(item.year ?? '')}</p>
            <p><strong>Género:</strong> ${escapeHtml(item.type ?? '')}</p>
            <p>${escapeHtml(item.description || 'Sin descripción')}</p>
            <div class="detail-actions">
              <button class="mini-btn" id="backToGrid">Volver</button>
              <button class="mini-btn" id="openLink">Abrir enlace</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('backToGrid').onclick = closeDetail;
      document.getElementById('openLink').onclick = () => {
        if (tg) tg.showAlert('Aquí luego abrirías el reproductor o enlace permitido.');
        else alert('Abrir enlace');
      };
      if (tg) tg.expand();
    }

    function closeDetail() {
      detailView.classList.remove('active');
      detailView.innerHTML = '';
    }

    async function loadCatalog() {
      try {
        const res = await fetch(`${API_BASE}/public/content`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allItems = await res.json();
      } catch (e) {
        allItems = [
          { title: 'Scream 7', type: 'Terror', year: 2026, description: 'Demo local', is_featured: true, slug: 'scream-7', poster_url: '' },
          { title: 'M3GAN 2.0', type: 'Ciencia ficción', year: 2025, description: 'Demo local', is_featured: true, slug: 'm3gan-2-0', poster_url: '' },
          { title: 'La Odisea', type: 'Aventura', year: 2026, description: 'Demo local', is_featured: false, slug: 'la-odisea', poster_url: '' },
          { title: 'Toy Story 5', type: 'Animación', year: 2026, description: 'Demo local', is_featured: false, slug: 'toy-story-5', poster_url: '' }
        ];
      }
      filteredItems = [...allItems];
      renderGrid();
    }

    filterButtons.forEach(btn => btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      applyFilters();
    }));

    searchInput.addEventListener('input', applyFilters);
    typeSelect.addEventListener('change', applyFilters);
    loadMoreBtn.addEventListener('click', () => {
      visibleCount += 12;
      renderGrid();
    });
    closeDetailBtn.addEventListener('click', closeDetail);

    if (tg) {
      tg.ready();
      tg.expand();
      document.getElementById('userLabel').textContent = 'Dentro de Telegram';
      document.getElementById('modeChip').textContent = 'Telegram WebApp';
    }

    loadCatalog();
  </script>
</body>
</html>
